spring:
  application:
    name: redis-otp-service
  datasource:
    url: jdbc:h2:mem:authDb
    driverClassName: org.h2.Driver
    username: admin
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


  redis:
    host: localhost
    port: 6379

server:
  port: 9090
